# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/shopapi
spring.datasource.username=aeternitas
spring.datasource.password=4141
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# server.servlet.context-path=/api

# Открыть доступ к Swagger без авторизации
springdoc.swagger-ui.path=/swagger-ui.html

# springdoc.swagger-ui.path=/swagger.html

springdoc.api-docs.path=/api-docs
springdoc.show-actuator=true

springdoc.paths-to-match=/api/**

springdoc.info.title=Shop API
springdoc.info.version=1.0.0
springdoc.info.description=API для управления магазином
springdoc.info.contact.name=Саляхов Артур
springdoc.info.contact.email=misericordiamt@gmail.com

# Улучшенные настройки Swagger
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.swagger-ui.defaultModelExpandDepth=2
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.show-extensions=true