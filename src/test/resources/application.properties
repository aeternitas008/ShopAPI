# Test Configuration
spring.config.activate.on-profile=test

# H2 In-Memory Database (быстро, изолированно, не требует установки PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate для тестов
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false                  # Отключаем логирование SQL в тестах (меньше шума)
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Отключаем ненужные для тестов функции
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Отключаем Swagger в тестах (не нужен)
springdoc.enabled=false

# Отключаем ненужные компоненты для ускорения тестов
spring.main.lazy-initialization=true
spring.jmx.enabled=false

# Логирование для тестов (только ошибки)
logging.level.root=ERROR
logging.level.com.example.shop=ERROR
logging.level.org.springframework=ERROR